<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PabloCovers - Generador de Miniaturas</title>
    <style>
        :root {
            --bg-dark: #121212;
            --panel-bg: #1e1e1e;
            --text-light: #ffffff;
            --text-muted: #a0a0a0;
            --accent: #1DB954;
            --border: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 500px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 4px;
        }

        .preview-container {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1/1;
            background-color: var(--panel-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            position: relative;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls {
            width: 100%;
            max-width: 500px;
            background-color: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-size: 14px;
            font-weight: 600;
            color: #ddd;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background-color: #2a2a2a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        .color-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input[type="color"] {
            -webkit-appearance: none;
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 8px;
            background: none;
            cursor: pointer;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: 2px solid var(--border);
            border-radius: 8px;
        }

        .color-presets {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .color-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .color-btn:active {
            transform: scale(0.9);
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px !important;
            font-weight: 400 !important;
            color: var(--text-light) !important;
            cursor: pointer;
        }

        .checkbox-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .file-upload {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .file-upload input {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #333;
            color: white;
            text-align: center;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-ai {
            background-color: #444;
            color: #fff;
            margin-top: 10px;
            display: none; /* Oculto por defecto hasta que se sube una foto */
            font-size: 14px;
        }
        
        .btn-ai:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-primary {
            background-color: var(--accent);
            color: black;
            font-weight: 800;
            margin-top: 10px;
        }

        .btn-primary:active {
            background-color: #189e47;
        }
        
        .gallery-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 4px 0 10px 0;
            scrollbar-width: none;
        }
        
        .gallery-container::-webkit-scrollbar {
            display: none;
        }

        .gallery-item {
            flex: 0 0 64px;
            height: 64px;
            background-color: #2a2a2a;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
            overflow: hidden;
            position: relative;
        }

        .gallery-item img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }

        .gallery-item.active {
            border-color: var(--accent);
            background-color: #333;
        }

        .gallery-item .none-icon {
            font-size: 24px;
            color: #888;
        }

        .footer {
            margin-top: 30px;
            margin-bottom: 20px;
            display: flex;
            gap: 24px;
            justify-content: center;
            align-items: center;
        }

        .footer a {
            color: var(--text-muted);
            transition: color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .footer a:hover {
            color: var(--accent);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>PabloCovers</h1>
        <p>Generador de Miniaturas para Spotify, YouTube Music, Apple Music, Tidal...</p>
    </div>

    <div class="preview-container">
        <canvas id="coverCanvas" width="1000" height="1000"></canvas>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>Título Principal</label>
            <input type="text" id="mainTitle" value="Nombre de la playlist" oninput="drawCanvas()">
        </div>

        <div class="control-group">
            <label>Subtítulo</label>
            <input type="text" id="subTitle" value="@pabloinfo1" oninput="drawCanvas()">
        </div>

        <div class="control-group">
            <label>Color de Fondo</label>
            <div class="color-row">
                <input type="color" id="bgColor" value="#E60026" oninput="drawCanvas()">
                <div class="color-presets" id="bgPresets"></div>
            </div>
        </div>

        <div class="control-group">
            <label>Color de Acento (Píldora / Subtítulo)</label>
            <div class="color-row">
                <input type="color" id="accentColor" value="#80E5FF" oninput="updateUIAccent(); drawCanvas();">
                <div class="color-presets" id="accentPresets"></div>
            </div>
        </div>

        <div class="control-group">
            <label>Color del Título Principal</label>
            <div class="color-row">
                <input type="color" id="titleColor" value="#FFFFFF" oninput="uncheckSync(); drawCanvas();">
                <label class="checkbox-label">
                    <input type="checkbox" id="syncTitleAccent" onchange="syncColors(); drawCanvas();">
                    Igualar al color de acento
                </label>
            </div>
        </div>

        <div class="control-group">
            <label>Elige un PNG de la galería 3D</label>
            <div class="gallery-container" id="emojiGallery"></div>
        </div>

        <div class="control-group">
            <label>O sube tu propia imagen central</label>
            <div class="file-upload">
                <button class="btn">Seleccionar imagen de tu móvil</button>
                <input type="file" id="imageLoader" accept="image/*">
            </div>
            <!-- Nuevo botón IA -->
            <button class="btn btn-ai" id="btnRemoveBg" onclick="processAIBackground()">🪄 Quitar fondo con IA</button>
        </div>

        <button class="btn btn-primary" onclick="downloadCover()">Descargar Miniatura</button>
    </div>

    <footer class="footer">
        <a href="mailto:pabloinfo1@gmail.com" target="_blank" rel="noopener noreferrer" aria-label="Enviar correo">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
        </a>
        <a href="https://www.instagram.com/pabloinfo1" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
        </a>
    </footer>

    <script>
        const canvas = document.getElementById('coverCanvas');
        const ctx = canvas.getContext('2d');
        
        let uploadedImage = null;       // Objeto Image dibujado en el canvas
        let activeGalleryItem = 0;      
        let rawUploadedFile = null;     // Guardamos el archivo original para pasárselo a la IA

        const commonColors = ['#E60026', '#1DB954', '#0055FF', '#FF5500', '#FFD500', '#9900FF', '#121212', '#FFFFFF'];
        const accentColors = ['#80E5FF', '#1DB954', '#FFD500', '#FF4500', '#FF00FF', '#FFFFFF'];

        const fluentEmojis = [
            { id: 'none', name: 'Ninguno', url: null },
            { id: 'cd', name: 'CD', url: 'https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/Optical%20disk/3D/optical_disk_3d.png' },
            { id: 'cocktail', name: 'Cubata', url: 'https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/Cocktail%20glass/3D/cocktail_glass_3d.png' },
            { id: 'beer', name: 'Cerveza', url: 'https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/Clinking%20beer%20mugs/3D/clinking_beer_mugs_3d.png' },
            { id: 'ice', name: 'Hielo', url: 'https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/Ice/3D/ice_3d.png' },
            { id: 'fire', name: 'Fuego', url: 'https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/Fire/3D/fire_3d.png' },
            { id: 'party', name: 'Fiesta', url: 'https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/Party%20popper/3D/party_popper_3d.png' },
            { id: 'alien', name: 'Alien', url: 'https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/Alien/3D/alien_3d.png' },
            { id: 'thumbsup', name: 'Pulgar', url: 'https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/Thumbs%20up/Default/3D/thumbs_up_3d_default.png' },
            { id: 'headphones', name: 'Cascos', url: 'https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/Headphone/3D/headphone_3d.png' },
            { id: 'rocket', name: 'Cohete', url: 'https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/Rocket/3D/rocket_3d.png' }
        ];

        function init() {
            generateColorPresets('bgPresets', commonColors, 'bgColor');
            generateColorPresets('accentPresets', accentColors, 'accentColor');
            generateEmojiGallery();
            updateUIAccent();
            drawCanvas();
        }

        function generateColorPresets(containerId, colors, inputId) {
            const container = document.getElementById(containerId);
            colors.forEach(color => {
                const btn = document.createElement('div');
                btn.className = 'color-btn';
                btn.style.backgroundColor = color;
                if(color === '#FFFFFF' || color === '#121212') btn.style.border = '1px solid #444';
                
                btn.onclick = () => {
                    document.getElementById(inputId).value = color;
                    if(inputId === 'accentColor') updateUIAccent();
                    if(inputId === 'titleColor') uncheckSync();
                    drawCanvas();
                };
                container.appendChild(btn);
            });
        }

        function generateEmojiGallery() {
            const container = document.getElementById('emojiGallery');
            fluentEmojis.forEach((emoji, index) => {
                const item = document.createElement('div');
                item.className = 'gallery-item' + (index === 0 ? ' active' : '');
                item.dataset.index = index;
                item.title = emoji.name; 
                
                if (emoji.url === null) {
                    item.innerHTML = '<span class="none-icon">🚫</span>';
                } else {
                    item.innerHTML = `<img src="${emoji.url}" alt="${emoji.name}" loading="lazy" crossorigin="anonymous" onerror="this.style.display='none'; this.parentElement.innerHTML+='<span class=\\'none-icon\\'>⚠️</span>';">`;
                }

                item.onclick = () => selectEmoji(index);
                container.appendChild(item);
            });
        }

        function selectEmoji(index) {
            document.querySelectorAll('.gallery-item').forEach(el => el.classList.remove('active'));
            document.querySelector(`.gallery-item[data-index="${index}"]`).classList.add('active');
            activeGalleryItem = index;
            
            // Ocultar botón IA si se selecciona de galería y limpiar archivo local
            document.getElementById('btnRemoveBg').style.display = 'none';
            document.getElementById('imageLoader').value = '';
            rawUploadedFile = null;

            const emoji = fluentEmojis[index];
            if (emoji.url === null) {
                uploadedImage = null;
                drawCanvas();
                return;
            }

            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = () => {
                uploadedImage = img;
                drawCanvas();
            };
            img.src = emoji.url;
        }

        // Subida de imagen propia
        document.getElementById('imageLoader').addEventListener('change', function(e) {
            if (e.target.files[0]) {
                rawUploadedFile = e.target.files[0];
                
                // Configurar y mostrar el botón de la IA
                const btnAi = document.getElementById('btnRemoveBg');
                btnAi.style.display = 'block';
                btnAi.innerText = "🪄 Quitar fondo con IA";
                btnAi.disabled = false;

                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        uploadedImage = img;
                        document.querySelectorAll('.gallery-item').forEach(el => el.classList.remove('active'));
                        document.querySelector('.gallery-item[data-index="0"]').classList.add('active');
                        drawCanvas();
                    }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(rawUploadedFile);
            }
        });

        // 🧠 Lógica de la IA (Se importa dinámicamente)
        async function processAIBackground() {
            if (!rawUploadedFile) return;
            
            const btnAi = document.getElementById('btnRemoveBg');
            btnAi.innerText = "⏳ Descargando IA (puede tardar un poco la 1º vez)...";
            btnAi.disabled = true;

            try {
                // Importamos la librería al vuelo desde jsDelivr / Unpkg
                const module = await import('https://unpkg.com/@imgly/background-removal@1.4.3/dist/imgly-background-removal.js');
                const imglyRemoveBackground = module.default;
                
                btnAi.innerText = "🪄 Procesando recorte... (no cierres)";

                // Configurar la ruta pública para que descargue bien los modelos wasm/onnx
                const config = {
                    publicPath: "https://unpkg.com/@imgly/background-removal@1.4.3/dist/"
                };

                // Ejecutamos la IA sobre el archivo original
                const transparentBlob = await imglyRemoveBackground(rawUploadedFile, config);
                const url = URL.createObjectURL(transparentBlob);
                
                // Reemplazamos la imagen actual por la recortada
                const img = new Image();
                img.onload = () => {
                    uploadedImage = img;
                    drawCanvas();
                    btnAi.innerText = "✅ Fondo eliminado";
                };
                img.src = url;

            } catch (error) {
                console.error(error);
                alert("Hubo un error recortando la foto. Comprueba tu conexión a internet e inténtalo de nuevo.");
                btnAi.innerText = "🪄 Reintentar IA";
                btnAi.disabled = false;
            }
        }

        function updateUIAccent() {
            const accent = document.getElementById('accentColor').value;
            document.documentElement.style.setProperty('--accent', accent);
            
            const activeGalleryItemEl = document.querySelector('.gallery-item.active');
            if(activeGalleryItemEl) {
                activeGalleryItemEl.style.borderColor = accent;
            }
            
            if(document.getElementById('syncTitleAccent').checked) {
                syncColors();
            }
        }

        function syncColors() {
            if (document.getElementById('syncTitleAccent').checked) {
                document.getElementById('titleColor').value = document.getElementById('accentColor').value;
            }
        }

        function uncheckSync() {
            document.getElementById('syncTitleAccent').checked = false;
        }

        function drawCanvas() {
            const title = document.getElementById('mainTitle').value;
            const subtitle = document.getElementById('subTitle').value;
            const bg = document.getElementById('bgColor').value;
            const accent = document.getElementById('accentColor').value;
            const titleCol = document.getElementById('titleColor').value;
            
            const w = canvas.width;
            const h = canvas.height;

            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, w, h);

            ctx.fillStyle = accent;
            ctx.font = "600 32px system-ui, -apple-system, sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(subtitle, w / 2, 140);

            if (uploadedImage) {
                const maxSize = w * 0.65;
                const scale = Math.min(maxSize / uploadedImage.width, maxSize / uploadedImage.height);
                const imgW = uploadedImage.width * scale;
                const imgH = uploadedImage.height * scale;
                
                const x = (w - imgW) / 2;
                const y = (h - imgH) / 2 + 20; 
                
                ctx.drawImage(uploadedImage, x, y, imgW, imgH);
            }

            ctx.fillStyle = titleCol;
            ctx.font = "900 96px system-ui, -apple-system, Montserrat, sans-serif";
            ctx.letterSpacing = "-2px";
            
            ctx.shadowColor = "rgba(0,0,0,0.4)";
            ctx.shadowBlur = 20;
            ctx.shadowOffsetY = 5;
            
            ctx.fillText(title, w / 2, h / 2 + 35);
            
            ctx.shadowColor = "transparent";
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;

            const pillWidth = 80;
            const pillHeight = 16;
            const pillX = (w - pillWidth) / 2;
            const pillY = h - 120;
            
            ctx.fillStyle = accent;
            ctx.beginPath();
            ctx.roundRect(pillX, pillY, pillWidth, pillHeight, pillHeight / 2);
            ctx.fill();
        }

        function downloadCover() {
            try {
                const link = document.createElement('a');
                link.download = `PabloCovers_${document.getElementById('mainTitle').value.replace(/\s+/g, '_')}.png`;
                link.href = canvas.toDataURL('image/png', 1.0);
                link.click();
            } catch (err) {
                alert("Error al descargar. Si estás viendo esto en local, asegúrate de que el CORS permite la descarga.");
                console.error(err);
            }
        }

        window.onload = init;
    </script>
</body>
</html>
